# Docker Compose — PRODUCTION
#
# Frontend: npm run build → nginx (port 80 in container).
# Start: ./run_docker.sh --prod
#
# Requires .env (copy from .env.example). PostgreSQL is the default database.
# Load defaults (~2 GB VPS): 2 Gunicorn workers × 4 threads, Postgres 128MB shared_buffers.

services:
  db:
    image: postgres:16-alpine
    container_name: completebytepos_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-completebytepos}
      POSTGRES_USER: ${POSTGRES_USER:-completebytepos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-completebytepos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Local admin tools only — do not publish Postgres on 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    restart: unless-stopped
    networks:
      - completebytepos_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-completebytepos} -d ${POSTGRES_DB:-completebytepos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: completebytepos_backend
    hostname: backend
    ports:
      # Only reachable on the VPS itself. Browsers should use :3000 (nginx).
      # Publishing 0.0.0.0:8000 invites internet scanners (fake Host headers,
      # RDP probes, HTTP/2 PRI) that show up as DisallowedHost in the logs.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./be:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    working_dir: /app
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SETTINGS_MODULE=config.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-completebytepos}
      - DB_USER=${POSTGRES_USER:-completebytepos}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-completebytepos}
      - POSTGRES_DB=${POSTGRES_DB:-completebytepos}
      - POSTGRES_USER=${POSTGRES_USER:-completebytepos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-completebytepos}
      - DB_CONN_MAX_AGE=${DB_CONN_MAX_AGE:-300}
      - PYTHONUNBUFFERED=1
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-60}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-800}
    command: >
      sh -c "
        mkdir -p /app/logs &&
        python manage.py migrate --noinput &&
        python manage.py init_permissions --noinput || python manage.py init_permissions || true &&
        python manage.py init_modules || true &&
        python manage.py create_users || true &&
        python manage.py collectstatic --noinput || true &&
        gunicorn config.wsgi:application
          --bind 0.0.0.0:8000
          --workers $${GUNICORN_WORKERS:-2}
          --threads $${GUNICORN_THREADS:-4}
          --timeout $${GUNICORN_TIMEOUT:-60}
          --keep-alive 5
          --max-requests $${GUNICORN_MAX_REQUESTS:-800}
          --max-requests-jitter 80
          --worker-tmp-dir /dev/shm
          --access-logfile -
          --error-logfile -
      "
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - completebytepos_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz/', timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        # Always same-origin. Do not bake :8000 from .env — Gunicorn is localhost-only.
        REACT_APP_API_URL: /api
    container_name: completebytepos_frontend
    hostname: frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - completebytepos_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend_static:
  backend_media:
  postgres_data:

networks:
  completebytepos_network:
    driver: bridge
